[project]
name = "judgelab"
version = "0.1.0"
description = "A hands-on engineering lab for building a modular AI assurance framework."
authors = [
    { name = "Sree R One" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.60.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting (matches organize-imports on save),
# B: bugbear (likely bugs), UP: pyupgrade (modern syntax), SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
# Only tests/: mutmut keeps a copy of the tests in mutants/.
testpaths = ["tests"]

[tool.mutmut]
# Mutation testing: vbench-qa breaks the code on purpose to check the tests notice.
source_paths = ["src/judgelab/"]
pytest_add_cli_args_test_selection = ["tests/"]
